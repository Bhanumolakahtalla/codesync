name: Provision dbt Cloud BigQuery Connection

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      # Terraform variables (auto-picked by TF)
      TF_VAR_gcp_service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      # TF_VAR_dbt_cloud_account_id: ${{ secrets.DBT_CLOUD_ACCOUNT_ID }}

      # # Providers auth
      # DBT_CLOUD_API_TOKEN: ${{ secrets.DBT_CLOUD_TOKEN }}
    defaults:
      run:
        working-directory: Terraform/module-example/

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

